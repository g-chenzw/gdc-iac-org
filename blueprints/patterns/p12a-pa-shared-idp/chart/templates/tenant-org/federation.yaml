{{- if .Values.tenantFederation.enabled }}
{{- $realm := .Values.controlPlane.realmSetup.realm }}
{{- $idpBaseUrl := printf "https://%s.%s/keycloak/realms/%s" .Values.fqdnPrefix .Values.dnsSuffix $realm }}
apiVersion: iam.global.gdc.goog/v1
kind: IdentityProviderConfig
metadata:
  name: {{ .Values.fqdnPrefix }}-saml
  namespace: platform
  labels:
    {{- include "p12a-pa-shared-idp.labels" . | nindent 4 }}
spec:
  saml:
    idpEntityID: {{ $idpBaseUrl | quote }}
    idpSingleSignOnURI: {{ printf "%s/protocol/saml" $idpBaseUrl | quote }}
    idpCertificateDataList:
      - {{ required "tenantFederation.idpCertificateDataBase64Pem is required when tenantFederation.enabled=true" .Values.tenantFederation.idpCertificateDataBase64Pem | quote }}
    userAttribute: "email"
    groupsAttribute: "groups"
    groupPrefix: {{ .Values.tenantFederation.groupPrefix | quote }}
    userPrefix: {{ .Values.tenantFederation.userPrefix | quote }}
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: {{ .Values.fqdnPrefix }}-saml-rb
  namespace: platform
  labels:
    {{- include "p12a-pa-shared-idp.labels" . | nindent 4 }}
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog
    kind: IAMRole
    name: {{ .Values.tenantFederation.roleName }}
  subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: {{ printf "%s%s" .Values.tenantFederation.groupPrefix .Values.tenantFederation.adminGroup }}
{{- end }}
