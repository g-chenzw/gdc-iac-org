# Stage 2: Applied to Organization Management Plane (infra-mp)
# 1. Issues Web TLS Certificate in istio-system and forwards Secret 'pa-demo-keycloak-mp-web-tls' to infra-cp.
# 2. Registers 'pa-demo-keycloak.<org>.<zone>.<domain>' across CustomerExternalNetwork (PA),
#    InfraExternalNetwork (IO), and internal VPCs.
apiVersion: pki.security.gdc.goog/v1
kind: Certificate
metadata:
  name: pa-demo-keycloak-mp-cert
  namespace: istio-system
  annotations:
    lcm.private.gdc.goog/claim-by-force: "true"
    helm.sh/resource-policy: keep
spec:
  dnsNames:
    - pa-demo-keycloak.gdchservices.zone1.gdc.example.com
    - pa-demo-keycloak.gdchservices.gdc.example.com
  duration: 8760h
  renewBefore: 2160h
  secretConfig:
    secretName: pa-demo-keycloak-mp-web-tls
    secretTemplate:
      annotations:
        pki.security.gdc.goog/forward-to-cp: "true"
    privateKeyConfig:
      algorithm: RSA
      size: 3072
---
# Exposes pa-demo-keycloak.<org>.<zone>.<domain> on InfraExternalNetwork (IO External VIP)
apiVersion: network.private.gdc.goog/v1alpha1
kind: DNSRegistration
metadata:
  name: pa-demo-keycloak
  namespace: pa-demo-keycloak
  annotations:
    lcm.private.gdc.goog/claim-by-force: "true"
spec:
  fqdnPrefix: pa-demo-keycloak
  resolutionConfig:
    exposeToNetwork: InfraExternalNetwork
    resolveTo:
      useDefaultIstioGateway:
        owningCluster: InfraCluster
        ingressLabel: infra
---
# Exposes pa-demo-keycloak.<org>.<zone>.<domain> on internal Infra VPC
apiVersion: network.private.gdc.goog/v1alpha1
kind: DNSRegistration
metadata:
  name: pa-demo-keycloak-infra-internal
  namespace: pa-demo-keycloak
  annotations:
    lcm.private.gdc.goog/claim-by-force: "true"
spec:
  fqdnPrefix: pa-demo-keycloak
  resolutionConfig:
    exposeToNetwork: VPC
    vpcIdentifier: infra
    resolveTo:
      useDefaultIstioGateway:
        owningCluster: InfraCluster
        ingressLabel: infra
---
# Exposes pa-demo-keycloak.<org>.<zone>.<domain> on internal Default (Customer) VPC
apiVersion: network.private.gdc.goog/v1alpha1
kind: DNSRegistration
metadata:
  name: pa-demo-keycloak-customer-internal
  namespace: pa-demo-keycloak
  annotations:
    lcm.private.gdc.goog/claim-by-force: "true"
spec:
  fqdnPrefix: pa-demo-keycloak
  resolutionConfig:
    exposeToNetwork: VPC
    vpcIdentifier: default
    resolveTo:
      useDefaultIstioGateway:
        owningCluster: InfraCluster
        ingressLabel: data
---
# Exposes pa-demo-keycloak.<org>.<zone>.<domain> on CustomerExternalNetwork (shared PA network VIP)
apiVersion: network.private.gdc.goog/v1alpha1
kind: DNSRegistration
metadata:
  name: pa-demo-keycloak-customer-external
  namespace: pa-demo-keycloak
  annotations:
    lcm.private.gdc.goog/claim-by-force: "true"
spec:
  fqdnPrefix: pa-demo-keycloak
  resolutionConfig:
    exposeToNetwork: CustomerExternalNetwork
    resolveTo:
      useDefaultIstioGateway:
        owningCluster: InfraCluster
        ingressLabel: data
