# Stage 1B: Applied to Organization Management Plane (infra-mp)
# Provisions the managed GDC PostgreSQL DBCluster (reconciles Service/pg-keycloak-db-ilb on infra-cp).
# Prerequisite: Secret/db-pw-keycloak-db must exist in namespace pa-demo-keycloak on infra-mp
# (created automatically at runtime by scripts/deploy.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: pa-demo-keycloak
  labels:
    app.kubernetes.io/part-of: p12a-pa-shared-idp
---
apiVersion: postgresql.dbadmin.gdc.goog/v1
kind: DBCluster
metadata:
  name: keycloak-db
  namespace: pa-demo-keycloak
  annotations:
    lcm.private.gdc.goog/claim-by-force: "true"
    fleet.dbadmin.goog/retain-admin-password-secret: "true"
    helm.sh/resource-policy: keep
  labels:
    fleet.dbadmin.goog/platform: rac
    validationRef: pa-demo-keycloak.keycloak-db
    app.kubernetes.io/part-of: p12a-pa-shared-idp
spec:
  primarySpec:
    adminUser:
      passwordRef:
        name: db-pw-keycloak-db
    version: "14"
    resources:
      memory: "1024Mi"
      cpu: "500m"
      disks:
        - name: DataDisk
          size: "5Gi"
