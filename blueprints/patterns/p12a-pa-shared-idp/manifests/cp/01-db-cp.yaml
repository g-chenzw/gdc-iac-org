# Stage 1A: Applied to Organization Control Plane (infra-cp)
# Creates the namespace for the shared Keycloak IdP.
# Note: Secrets (such as bundledidp-keycloak-database-pw) are created at runtime
# via scripts/deploy.sh or kubectl create secret generic, never stored in Git.
apiVersion: v1
kind: Namespace
metadata:
  name: pa-demo-keycloak
  labels:
    app.kubernetes.io/part-of: p12a-pa-shared-idp
