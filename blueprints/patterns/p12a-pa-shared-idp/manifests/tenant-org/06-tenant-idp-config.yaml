# Stage 5: Applied to Target Tenant Organization Global API Server
# Replace <BASE64_ENCODED_PEM_CERTIFICATE> with the base64-encoded PEM X.509 signing
# certificate retrieved from https://<fqdnPrefix>.<dnsSuffix>/keycloak/realms/<realm>/protocol/saml/descriptor
apiVersion: iam.global.gdc.goog/v1
kind: IdentityProviderConfig
metadata:
  name: pa-demo-keycloak-saml
  namespace: platform
spec:
  saml:
    idpEntityID: "https://pa-demo-keycloak.gdchservices.zone1.gdc.example.com/keycloak/realms/pa-demo"
    idpSingleSignOnURI: "https://pa-demo-keycloak.gdchservices.zone1.gdc.example.com/keycloak/realms/pa-demo/protocol/saml"
    idpCertificateDataList:
      - "<BASE64_ENCODED_PEM_CERTIFICATE>"
    userAttribute: "email"
    groupsAttribute: "groups"
    groupPrefix: "pa-kc-"
    userPrefix: "pa-kc-"
---
apiVersion: iam.global.gdc.goog/v1
kind: IAMRoleBinding
metadata:
  name: pa-demo-keycloak-saml-rb
  namespace: platform
spec:
  roleRef:
    apiGroup: iam.global.gdc.goog
    kind: IAMRole
    name: organization-iam-admin
  subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: pa-kc-pa-admins
