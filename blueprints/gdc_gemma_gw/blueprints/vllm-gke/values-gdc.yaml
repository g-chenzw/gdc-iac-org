# GDC air-gapped (GDC-ag) Production Values Override
# Purpose: Enforces GDC-ag Harbor image registry, local PVC model path, 8192 context window,
#          SAN ReadWriteMany storage, and bare-metal GPU node pool selectors.

image:
  repository: "harbor.gdc.local/gemma-repo/vllm-openai" # Override via --set image.repository="${REGISTRY_HOST}/vllm-openai"
  tag: "v1.0.0"                                         # Override via --set image.tag="${TAG}"
  pullPolicy: IfNotPresent

model:
  name: "/models/gemma-4-26B-A4B-it-weights" # Override with "/models/gemma-4-31B-it-weights" for the vllm-31b release
  servedModelName: "gemma4:26b"              # Override with "gemma4:31b" for the vllm-31b release
  maxModelLen: 8192                          # Production context window on A100/H100 (80GB VRAM)
  gpuMemoryUtilization: 0.90
  tensorParallelSize: 1                      # Set to 2 when sharding 31B across 2x 40GB/48GB GPUs

persistence:
  enabled: true
  storageClassName: "standard-rwx" # Mandatory GDC SAN StorageClass
  accessModes:
    - ReadWriteMany
  size: 150Gi

nodeSelector:
  cloud.google.com/gke-accelerator: null # Clear GKE L4 label inherited from values.yaml so pods schedule on GDC-ag nodes
  pool: gpu-moe                          # Default to MoE node pool; override via --set nodeSelector.pool=gpu-dense

tolerations:
- key: "nvidia.com/gpu"
  operator: "Exists"
  effect: "NoSchedule"
