{{- if and .Values.apps.enabled .Values.gateway.enabled -}}
{{- $ns := include "envoy-inference-pool.namespace" . -}}
{{- $labels := include "envoy-inference-pool.labels" . -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | default "envoy-ai-gateway" }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port | default 80 }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-buffer-policy
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}
  bufferLimit: {{ .Values.gateway.bufferLimit | default "50Mi" | quote }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-route
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    {{- range $poolKey, $pool := .Values.pools }}
    {{- if $pool.enabled }}
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ $pool.modelHeaderValue | quote }}
      backendRefs:
        - name: {{ $pool.name }}
          group: inference.networking.k8s.io
          kind: InferencePool
    {{- end }}
    {{- end }}
    {{- if .Values.pools.vllm26b.enabled }}
    # Default fallback route to fast 26B MoE InferencePool
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: ".*"
      backendRefs:
        - name: {{ .Values.pools.vllm26b.name }}
          group: inference.networking.k8s.io
          kind: InferencePool
    {{- end }}
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_tokens
      type: TotalToken
{{- if .Values.tokenRateLimit.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-token-ratelimit
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  targetRefs:
    - name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}
      kind: Gateway
      group: gateway.networking.k8s.io
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: {{ .Values.tokenRateLimit.userHeader | default "X-User-ID" }}
                  type: Distinct
          limit:
            requests: {{ .Values.tokenRateLimit.limit | default 50000 }}
            unit: {{ .Values.tokenRateLimit.unit | default "Hour" }}
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: {{ .Values.tokenRateLimit.costMetadataNamespace | default "io.envoy.ai_gateway" }}
                key: {{ .Values.tokenRateLimit.costMetadataKey | default "llm_total_tokens" }}
{{- if .Values.tokenRateLimit.deployRedis }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-redis
  namespace: {{ $ns }}
  labels:
    app: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-redis
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-redis
  template:
    metadata:
      labels:
        app: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-redis
        {{- $labels | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: {{ include "envoy-inference-pool.redisImage" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: {{ .Values.tokenRateLimit.redis.port | default 6379 }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.gateway.name | default "gemma-envoy-inference-pool" }}-redis
  ports:
    - name: redis
      port: {{ .Values.tokenRateLimit.redis.port | default 6379 }}
      targetPort: {{ .Values.tokenRateLimit.redis.port | default 6379 }}
{{- end }}
{{- end }}
{{- end }}
